
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>profile</title>
  <style>
    body {
      margin: 0;
      background-color: #000;
      color: #777;
      font-family: "SF Mono", Courier, monospace;
      min-height: 100vh;
      padding: 18vh 20px 40px;
      box-sizing: border-box;
    }

    .gallery {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .artwork {
      display: block;
      width: 30vw;
      max-width: 600px;
      height: auto;
    }

    .caption {
      width: 100%;
      max-width: 750px;
      margin-top: 60px;
      text-align: center;
    }

    .name {
      font-family: "Hiragino Mincho ProN", "Hiragino Mincho Pro", serif;
      font-weight: 400;
      color: #aaa;
      font-size: 13px;
      letter-spacing: 0.15em;
      margin: 0 0 7px;
    }

    .description {
      font-size: 10px;
      line-height: 1.6;
      max-width: 320px;
      margin: 0 auto;
      text-align: center;
    }

    .sns {
      color: #666;
      font-size: 10px;
      margin: 12px 0 0;
    }

    @media (max-width: 768px) {
      body {
        padding-top: 19vh;
      }

      .artwork {
        width: 80vw;
      }

      .caption {
        width: 90%;
        margin-top: 60px;
      }
    }
  </style>
</head>
<body>
  <div class="gallery">
    <img class="artwork" src="images/profile2026.png?v=2" alt="profile2026.png">

    <div class="caption">
      <p class="name">トイハニロフ</p>
      <p class="description">作詞、作編曲、歌、ミックス、マスタリング、アートワーク、動画など全てを自身で手がけている。</p>
      <p class="sns">snsなし</p>
    </div>
  </div>
</body>
</html>
